name: Build & Release Signed APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Signing Keystore (Secrets or Auto-Generated Fallback)
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"

          if [ -n "$SECRET_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository secret KEYSTORE_BASE64 (alias: upload)..."
            echo "$SECRET_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No custom KEYSTORE_BASE64 secret configured; generating self-signed release keystore (alias: upload)..."
            FALLBACK_PASS="apunkacommunication2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -dname "CN=Apun Ka Communication, OU=Mobile, O=tmadhu, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Ensure .env and optional google-services.json exist
        env:
          SECRET_GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$SECRET_GOOGLE_SERVICES_B64" ] && [ ! -f "app/google-services.json" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
            echo "$SECRET_GOOGLE_SERVICES_B64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          fi

      - name: Build Signed Release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK Artifact
        id: apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "Error: Signed release APK was not found in app/build/outputs/apk/release"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          CLEAN_APK="Apun-Ka-Communication-${RELEASE_TAG}-signed.apk"
          LATEST_APK="Apun-Ka-Communication-latest.apk"
          cp "$RAW_APK" "$CLEAN_APK"
          cp "$RAW_APK" "$LATEST_APK"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_path=$CLEAN_APK" >> "$GITHUB_OUTPUT"
          echo "latest_apk_path=$LATEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apun-Ka-Communication-${{ steps.apk.outputs.release_tag }}-signed-apk
          path: |
            ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.release_tag }}
          name: "Apun Ka Communication ${{ steps.apk.outputs.release_tag }}"
          body: |
            ### Apun Ka Communication — Signed Android Release (${{ steps.apk.outputs.release_tag }})

            - **Application ID**: `me.tmadhu.mandychat`
            - **Commit**: `${{ github.sha }}`
            - **Download**: Install `${{ steps.apk.outputs.apk_path }}` directly on your Android device.
          files: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.latest_apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
