name: Verify Android

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare debug signing
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 365 -dname 'CN=Android Debug'
      - name: Prepare Firebase client config for phone tests
        env:
          FIREBASE_CLIENT_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CLIENT_CONFIG" ]; then
            echo "$FIREBASE_CLIENT_CONFIG" | base64 -d > /tmp/firebase-client.json
            python3 -c 'import copy,json; p="/tmp/firebase-client.json"; d=json.load(open(p)); c=copy.deepcopy(next(x for x in d["client"] if x["client_info"]["android_client_info"]["package_name"]=="me.tmadhu.mandychat")); c["client_info"]["android_client_info"]["package_name"]="me.tmadhu.mandychat.calltest"; d["client"].append(c); json.dump(d,open("app/google-services.json","w"))'
          fi
      - name: Build phone-test APK
        run: gradle :app:assembleDebug -PsideBySideInstall --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        with:
          name: call-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Run regression tests
        run: gradle :app:testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'
      - name: Run Android lint
        if: always()
        run: gradle :app:lintDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: app/build/reports/
